[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-ml-suite"
version = "5.0.0"
description = "Formula 1 End-to-End Machine Learning Engineering Suite (v5.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.5.0",
    "torch>=2.5.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.10.0",
    "reportlab>=4.0.0",
    "pyarrow>=18.0.0",
    "streamlit>=1.40.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    "lightgbm>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
